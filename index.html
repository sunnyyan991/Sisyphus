<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="诸神的差事：一组荒诞短剧。">
<title>诸神的差事</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: a game title screen. Left: the series name and the list of jobs (episodes). Right: a painted vase panel previewing the selected job, with its chapters underneath. */
:root{
  --clay:#c96a32;
  --clay-deep:#ad5527;
  --clay-light:#dc8a52;
  --ink:#1b1410;
  --bone:#f3e2c7;
  --gold:#e8b04f;
  --display:"Noto Serif SC","Songti SC","STSong",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--clay)}
body{background:var(--clay);color:var(--ink);font-family:var(--body);margin:0;font-size:15px}
.menu{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:24px 32px;display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:28px 36px;align-items:start}
.band{height:18px;background:
  linear-gradient(var(--ink),var(--ink)) 0 0/100% 3px no-repeat,
  linear-gradient(var(--ink),var(--ink)) 0 100%/100% 3px no-repeat,
  repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 18px)}
.brand{display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.3em;opacity:.75}
h1{font-family:var(--display);font-weight:900;font-size:clamp(44px,7vw,72px);letter-spacing:.1em;margin:0;line-height:1.05;text-wrap:balance}
.lede{margin:0;line-height:1.8;font-size:14px;max-width:26em}
.eps{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.ep{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:baseline;padding:14px 16px;border:2px solid var(--ink);cursor:pointer;position:relative;transition:background .15s,color .15s}
.ep .no{grid-row:span 2;font-family:var(--display);font-weight:900;font-size:28px;line-height:1;opacity:.85;min-width:1.2em;text-align:center}
.ep .ttl{font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.04em;min-width:0}
.ep .job{font-size:12px;letter-spacing:.12em;opacity:.7}
.ep:hover{background:var(--clay-light)}
.ep[aria-selected="true"]{background:var(--ink);color:var(--bone)}
.ep[aria-selected="true"] .no{color:var(--gold)}
.ep[aria-selected="true"]::after{content:"";position:absolute;right:-12px;top:50%;width:14px;height:14px;background:var(--ink);transform:translateY(-50%) rotate(45deg)}
.ep:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.ep.locked{border-style:dashed}
.done{font-size:11px;letter-spacing:.1em;color:var(--gold);margin-left:8px;font-family:var(--body);font-weight:500}
.ep:not([aria-selected="true"]) .done{color:var(--ink);opacity:.75}
.detail{display:flex;flex-direction:column;gap:16px;min-width:0}
.stage{position:relative;aspect-ratio:16/9;max-width:100%;border:3px solid var(--ink);background:var(--clay-light);overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.info{background:var(--ink);color:var(--bone);border:2px solid var(--ink);box-shadow:inset 0 0 0 2px var(--bone);padding:20px 22px 22px;display:flex;flex-direction:column;gap:14px}
.info h2{font-family:var(--display);font-weight:900;font-size:clamp(22px,3vw,30px);margin:0;letter-spacing:.04em;text-wrap:balance}
.info p{margin:0;line-height:1.75;font-size:14px;opacity:.9;max-width:40em}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.play{font-family:var(--display);font-weight:900;font-size:18px;letter-spacing:.16em;background:var(--clay);color:var(--ink);border:2px solid var(--bone);padding:11px 26px;text-decoration:none;display:inline-block}
.play:hover{background:var(--gold)}
.play.alt{background:transparent;color:var(--bone);font-size:15px;padding:9px 16px}
.play.alt:hover{background:var(--gold);color:var(--ink)}
.play:focus-visible,.chap:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chlabel{font-size:11px;letter-spacing:.3em;opacity:.6;border-top:1px solid rgba(243,226,199,.2);padding-top:12px}
.chapters{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chap{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1.5px solid rgba(243,226,199,.45);color:var(--bone);text-decoration:none;min-width:0;height:100%}
.chap:hover{border-color:var(--gold);background:rgba(232,176,79,.12)}
.chap .n{font-size:11px;letter-spacing:.16em;opacity:.65}
.chap .t{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.06em}
.chap .seen{font-size:11px;color:var(--gold);letter-spacing:.08em}
.tbd p{opacity:.75}
footer{grid-column:1/-1;font-size:12px;opacity:.75;line-height:1.8}
@media (max-width:760px){
  .menu{grid-template-columns:1fr;gap:22px}
  .ep[aria-selected="true"]::after{display:none}
}
@media (prefers-reduced-motion:reduce){.ep{transition:none}}
</style>
</head>
<body>
<main class="menu">
  <section class="brand">
    <div class="band" aria-hidden="true"></div>
    <div class="eyebrow">一组荒诞短剧</div>
    <h1>诸神的差事</h1>
    <p class="lede">你是奥林匹斯新录用的公务员，归冥界人事部的赫尔墨斯管。每一份差事，都是一份永远做不完的工作。</p>
    <nav class="eps" role="tablist" aria-label="选择差事" id="eps"></nav>
  </section>

  <section class="detail" aria-live="polite">
    <div class="stage"><canvas id="c" aria-hidden="true"></canvas></div>
    <div class="info" id="info"></div>
  </section>

  <footer>灵感来自希腊神话、加缪《西西弗斯神话》与卡夫卡《普罗米修斯》。键盘可用 ↑ ↓ 选择差事。</footer>
</main>

<script>
(()=>{
const EPS=[
  {id:'sisyphus',no:'一',title:'西西弗斯再来一次',job:'踹石神',href:'sisyphus/index.html',
   blurb:'他把石头推上山，你在他快到山顶的时候一脚踹下去。宙斯开始考核绝望指数，石头上多了一张脸，工会也成立了。',
   chapters:[['第一章','入职'],['第二章','绩效'],['第三章','石头先生'],['第四章','罢工'],['第五章','一本书'],['第六章','调岗']]},
  {id:'prometheus',no:'二',title:'普罗米修斯，四种说法',job:'啄肝鹰（外包）',href:'prometheus/index.html',
   blurb:'宙斯的鹰辞职了，你穿上中号的鹰制服顶班。关于这份工作有四种说法，他坚持认为那是一件事的四个阶段。',
   chapters:[['序章','轮岗'],['传说之一','锁链'],['传说之二','岩石'],['传说之三','遗忘'],['传说之四','疲倦'],['尾声','山']]},
  {id:'tbd',no:'三',title:'待定',job:'岗位空缺',locked:true,blurb:'赫尔墨斯还在找下一个岗位。'}
];
const $=id=>document.getElementById(id);
let progress={};
try{progress=JSON.parse(localStorage.getItem('gods-progress')||'{}')||{}}catch(e){}
let sel=0;
try{const s=+localStorage.getItem('gods-menu-sel');if(EPS[s])sel=s;}catch(e){}

function renderList(){
  $('eps').innerHTML=EPS.map((e,i)=>{
    const p=progress[e.id]||{};
    return `<button class="ep${e.locked?' locked':''}" role="tab" id="tab${i}" aria-selected="${i===sel}" tabindex="${i===sel?0:-1}" data-i="${i}">
      <span class="no">${e.no}</span><span class="ttl">${e.title}${p.done?'<span class="done">已完成</span>':''}</span><span class="job">第${e.no}份差事 · ${e.job}</span></button>`;
  }).join('');
}
function renderInfo(){
  const e=EPS[sel],p=progress[e.id]||{},seen=p.seen||[];
  if(e.locked){$('info').className='info tbd';$('info').innerHTML=`<h2>第三份差事</h2><p>${e.blurb}</p>`;return;}
  const last=seen.length&&!p.done?Math.max(...seen):0;
  $('info').className='info';
  $('info').innerHTML=`<h2>${e.title}</h2><p>${e.blurb}</p>
    <div class="actions"><a class="play" href="${e.href}#ch1">${p.done||seen.length?'从头开始':'上岗'}</a>${last>1?`<a class="play alt" href="${e.href}#ch${last}">继续：${e.chapters[last-1].join(' · ')}</a>`:''}</div>
    <div class="chlabel">选择章节</div>
    <ol class="chapters">${e.chapters.map((c,i)=>`<li><a class="chap" href="${e.href}#ch${i+1}"><span class="n">${c[0]}</span><span class="t">${c[1]}</span>${seen.includes(i+1)?'<span class="seen">已看过</span>':''}</a></li>`).join('')}</ol>`;
}
function select(i,focus){
  sel=i;try{localStorage.setItem('gods-menu-sel',i)}catch(e){}
  renderList();renderInfo();if(focus)$('tab'+i).focus();
}
$('eps').addEventListener('click',ev=>{const b=ev.target.closest('.ep');if(b)select(+b.dataset.i);});
$('eps').addEventListener('keydown',ev=>{
  if(ev.key!=='ArrowDown'&&ev.key!=='ArrowUp')return;ev.preventDefault();
  select((sel+(ev.key==='ArrowDown'?1:EPS.length-1))%EPS.length,true);
});
renderList();renderInfo();

// ---------- the preview vignette ----------
const C={clay:'#c96a32',deep:'#ad5527',light:'#dc8a52',ink:'#1b1410',bone:'#f3e2c7',gold:'#e8b04f',rock:'#9e4b23',far:'#bd6230'};
const cvs=$('c'),ctx=cvs.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0;
function resize(){const r=cvs.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;if(!W)return;cvs.width=W*d;cvs.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
if('ResizeObserver' in window)new ResizeObserver(resize).observe(cvs);else addEventListener('resize',resize);
resize();

function meander(y,h){
  ctx.save();ctx.strokeStyle=C.ink;ctx.lineWidth=Math.max(2,h*.14);ctx.beginPath();
  for(let x=0;x<W+h;x+=h){ctx.moveTo(x,y+h);ctx.lineTo(x,y);ctx.lineTo(x+h*.8,y);ctx.lineTo(x+h*.8,y+h*.62);ctx.lineTo(x+h*.38,y+h*.62);ctx.lineTo(x+h*.38,y+h*.32);}
  ctx.moveTo(0,y+h);ctx.lineTo(W,y+h);ctx.stroke();ctx.restore();
}
function frame(){
  const grd=ctx.createRadialGradient(W*.5,H*.3,10,W*.5,H*.4,W*.8);grd.addColorStop(0,C.light);grd.addColorStop(1,C.clay);
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);meander(H*.03,Math.max(10,H*.06));
  ctx.fillStyle=C.ink;ctx.fillRect(0,H*.94,W,H*.06);
}
function pusher(x,y,h,ux,uy,t,pushing){ // tiny black-figure body, feet at x,y, facing up the slope
  ctx.save();ctx.strokeStyle=C.ink;ctx.fillStyle=C.ink;ctx.lineCap='round';ctx.lineWidth=h*.08;
  const sw=Math.sin(t*8)*h*.12;
  const hip={x:x-ux*h*.1,y:y-h*.42};
  const sh=pushing?{x:hip.x+h*.26,y:hip.y-h*.2}:{x:hip.x,y:hip.y-h*.32};
  ctx.beginPath();ctx.moveTo(hip.x,hip.y);ctx.lineTo(x+ux*sw,y+uy*sw);ctx.moveTo(hip.x,hip.y);ctx.lineTo(x-ux*(sw+h*.08),y-uy*(sw+h*.08));ctx.stroke();
  ctx.lineWidth=h*.13;ctx.beginPath();ctx.moveTo(hip.x,hip.y);ctx.lineTo(sh.x,sh.y);ctx.stroke();
  ctx.lineWidth=h*.08;ctx.beginPath();ctx.moveTo(sh.x,sh.y);
  if(pushing)ctx.lineTo(sh.x+h*.24,sh.y-h*.06);else ctx.lineTo(sh.x-h*.05,sh.y+h*.28);ctx.stroke();
  ctx.beginPath();ctx.arc(sh.x+(pushing?h*.08:0),sh.y-h*.12,h*.09,0,7);ctx.fill();
  ctx.restore();
}
function sisyphus(t){
  frame();
  const x0=W*.12,y0=H*.84,x1=W*.82,y1=H*.34,L=Math.hypot(x1-x0,y0-y1),ux=(x1-x0)/L,uy=(y1-y0)/L;
  ctx.beginPath();ctx.moveTo(-5,H);ctx.lineTo(-5,y0);ctx.lineTo(x0,y0);ctx.lineTo(x1,y1);ctx.lineTo(W+5,y1);ctx.lineTo(W+5,H);ctx.closePath();
  ctx.fillStyle=C.deep;ctx.fill();ctx.strokeStyle=C.ink;ctx.lineWidth=3;ctx.stroke();
  const cx=x1+(W-x1)*.55,cw=H*.04;ctx.fillStyle=C.ink;ctx.fillRect(cx-cw/2,y1-H*.2,cw,H*.2);ctx.fillRect(cx-cw,y1-H*.22,cw*2,H*.025);
  const R=H*.07,k=(t%6)/6,up=.72;
  let f;if(k<up)f=.06+.8*(k/up);else{const r=Math.min(1,(k-up)/(1-up)*1.6);f=.86-(.86-.06)*r*r;}
  const at=s=>({x:x0+ux*s*L,y:y0+uy*s*L});
  const p=at(f),bc={x:p.x-uy*R*-1*-1*0+uy*R,y:p.y-ux*R};
  const pf=k<up?f-R*2.2/L:Math.max(.0,.86-R*2.2/L-((k-up)/(1-up))*.6);
  const pp=at(pf);
  pusher(pp.x,pp.y,H*.2,ux,uy,t,k<up);
  ctx.save();ctx.translate(bc.x,bc.y);ctx.rotate(f*L/R);ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();
  ctx.fillStyle=C.bone;ctx.strokeStyle=C.bone;ctx.lineWidth=2;ctx.beginPath();ctx.arc(-R*.32,-R*.2,R*.1,0,7);ctx.arc(R*.32,-R*.2,R*.1,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(0,R*.08,R*.42,.35,Math.PI-.35);ctx.stroke();ctx.restore();
  if(k>up-.04&&k<up+.08){const e=1-Math.abs(k-up)/.08,top=at(.86);const tip={x:top.x+uy*R+R*1.1,y:top.y-ux*R-R*.4};
    const fx=tip.x+R*4*(1-e),fy=tip.y-R*5*(1-e);
    ctx.save();ctx.fillStyle=C.ink;ctx.strokeStyle=C.ink;ctx.lineWidth=R*.7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(fx+R*6,fy-R*7);ctx.lineTo(fx+R*.5,fy-R*.6);ctx.stroke();
    ctx.beginPath();ctx.ellipse(fx,fy,R*.9,R*.4,-.75,0,7);ctx.fill();ctx.restore();}
}
function prometheus(t){
  frame();
  ctx.fillStyle=C.far;ctx.beginPath();ctx.moveTo(0,H*.86);[[0,.62],[.1,.48],[.2,.58],[.32,.42],[.44,.56],[.56,.5],[.6,.86]].forEach(([x,y])=>ctx.lineTo(W*x,H*y));ctx.fill();
  ctx.fillStyle=C.deep;ctx.fillRect(0,H*.86,W,H*.08);
  ctx.beginPath();ctx.moveTo(W+5,H*.16);for(let y=H*.16;y<=H;y+=6)ctx.lineTo(W*.6-(y/H)*W*.05+Math.sin(y*.06)*3,y);ctx.lineTo(W+5,H);ctx.closePath();
  ctx.fillStyle=C.rock;ctx.fill();ctx.strokeStyle=C.ink;ctx.lineWidth=3;ctx.stroke();
  const px=W*.76,fy=H*.74,h=H*.34;
  ctx.save();ctx.strokeStyle=C.ink;ctx.fillStyle=C.ink;ctx.lineCap='round';ctx.lineWidth=h*.07;
  const hip={x:px,y:fy-h*.45},sh={x:px,y:fy-h*.78};
  [-1,1].forEach(s=>{ctx.beginPath();ctx.moveTo(hip.x,hip.y);ctx.lineTo(px+s*h*.1,fy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(sh.x,sh.y);ctx.lineTo(px+s*h*.32,sh.y-h*.2);ctx.stroke();});
  ctx.lineWidth=h*.14;ctx.beginPath();ctx.moveTo(hip.x,hip.y);ctx.lineTo(sh.x,sh.y);ctx.stroke();
  ctx.beginPath();ctx.arc(px,fy-h*.92,h*.085,0,7);ctx.fill();
  ctx.fillRect(px-h*.3,fy,h*.6,h*.04);
  const k=(t%4)/4,gr=k<.55?k/.55:(k<.65?1:0);
  ctx.fillStyle=gr>=.98?C.gold:C.light;ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(px-h*.07,fy-h*.56,h*.07*(.3+.7*gr),h*.055*(.3+.7*gr),-.3,0,7);ctx.fill();ctx.stroke();
  ctx.restore();
  // a dead tree to perch on
  const A={x:W*.2,y:H*.36},R=H*.05;
  ctx.strokeStyle=C.ink;ctx.lineWidth=R*.4;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(A.x-R*.2,H*.86);ctx.lineTo(A.x-R*.2,A.y+R*.5);ctx.lineTo(A.x+R*1.2,A.y+R*.3);ctx.stroke();
  // the eagle's swoop
  const B={x:px-h*.07-R*1.25,y:fy-h*.56+R*.3};
  let u=0;if(k>.55&&k<.65)u=(k-.55)/.1;else if(k>=.65&&k<.85)u=1-(k-.65)/.2;
  u=u*u*(3-2*u);
  const ex=A.x+(B.x-A.x)*u,ey=A.y+(B.y-A.y)*u-Math.sin(u*Math.PI)*H*.12,fly=k>.55&&k<.85,dir=k>=.65&&k<.85?-1:1;
  ctx.save();ctx.translate(ex,ey);ctx.scale(dir,1);ctx.fillStyle=C.ink;
  ctx.beginPath();ctx.ellipse(0,0,R*.9,R*.5,-.2,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(-R*.7,0);ctx.lineTo(-R*1.5,R*.35);ctx.lineTo(-R*1.4,-R*.1);ctx.fill();
  if(fly){const f=Math.sin(t*16);ctx.beginPath();ctx.moveTo(-R*.3,-R*.1);ctx.lineTo(-R,-R*.2-R*1.4*Math.cos(f));ctx.lineTo(R*.5,-R*.2);ctx.fill();}
  ctx.beginPath();ctx.arc(R*.78,-R*.45,R*.33,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(R*1,-R*.57);ctx.quadraticCurveTo(R*1.4,-R*.53,R*1.3,-R*.23);ctx.lineTo(R*1.04,-R*.35);ctx.fill();
  ctx.fillStyle=C.bone;for(let i=0;i<4;i++){const a=Math.PI*(1.15+i*.22);ctx.beginPath();ctx.ellipse(R*.78+Math.cos(a)*R*.33,-R*.45+Math.sin(a)*R*.33,R*.11,R*.045,a+Math.PI/2,0,7);ctx.fill();}
  ctx.restore();
}
function tbd(t){
  frame();
  ctx.fillStyle=C.ink;ctx.font=`900 ${Math.max(40,H*.4)}px "Noto Serif SC",serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.globalAlpha=.25+.1*Math.sin(t*1.5);ctx.fillText('？',W/2,H*.52);ctx.globalAlpha=1;
}
const t0=performance.now();
function loop(now){
  const t=reduce?2.6:(now-t0)/1000;
  if(W){const id=EPS[sel].id;(id==='sisyphus'?sisyphus:id==='prometheus'?prometheus:tbd)(t);}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
